name: com
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.7.0
  table_calendar: ^3.0.9
  intl: ^0.19.0
  cloud_firestore: ^5.4.2
  shared_preferences: ^2.3.2
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

  assets:
    - assets/images/melody.png

